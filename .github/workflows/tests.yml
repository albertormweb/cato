name: checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  framework:
    name: Framework integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: pip install pytest

      - name: Check portable ruleset copies are in sync
        run: python tooling/sync_rules.py

      - name: Validate framework structure
        run: python -m pytest tooling/ -c tooling/pytest.ini
